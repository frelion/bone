[workspace]
members = ["crates/bone-provider"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
futures-util = "0.3"
rig-core = { version = "=0.42.0", default-features = false, features = ["reqwest", "rustls"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
