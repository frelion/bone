[workspace]
members = [
    "crates/bone-app",
    "crates/bone-agent",
    "crates/bone-llm",
    "crates/bone-store",
    "crates/bone-tools",
]
exclude = ["third_party/rig-core-0.42.0"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
bytes = "1"
crossterm = "0.29"
futures-util = "0.3"
fs2 = "0.4"
globset = "0.4"
grep-regex = "0.1"
grep-searcher = "0.1"
http = "1"
ignore = "0.4"
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
libc = "0.2"
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = "0.9.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
rig-core = { version = "=0.42.0", path = "third_party/rig-core-0.42.0", default-features = false }
rusqlite = "0.40.2"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
uuid = { version = "1", features = ["serde", "v4"] }
walkdir = "2"
