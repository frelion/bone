[package]
name = "bone"
version = "0.9.4"
edition = "2024"
rust-version = "1.96"
description = "One conversational agent, persistent internal jobs, native Rig providers"
license = "MIT"

[features]
default = []
bedrock = ["dep:rig-bedrock"]
vertexai = ["dep:rig-vertexai"]
candle = ["dep:rig-candle"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
fs2 = "0.4"
libc = "0.2"
rig-core = { git = "https://github.com/0xPlaygrounds/rig", rev = "063bcf0e9cee2fd5287fbb807e67d3e9d418ba0a", default-features = false, features = ["reqwest", "rustls"] }
rig-reqwest = { git = "https://github.com/0xPlaygrounds/rig", rev = "063bcf0e9cee2fd5287fbb807e67d3e9d418ba0a", default-features = false, features = ["rustls"] }
rig-bedrock = { git = "https://github.com/0xPlaygrounds/rig", rev = "063bcf0e9cee2fd5287fbb807e67d3e9d418ba0a", optional = true }
rig-vertexai = { git = "https://github.com/0xPlaygrounds/rig", rev = "063bcf0e9cee2fd5287fbb807e67d3e9d418ba0a", optional = true }
rig-candle = { git = "https://github.com/0xPlaygrounds/rig", rev = "063bcf0e9cee2fd5287fbb807e67d3e9d418ba0a", optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
ratatui-textarea = "0.9.2"
tui-markdown = { version = "0.3.10", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.9"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["serde", "v4"] }
unicode-segmentation = "1"
unicode-width = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Authorization"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = "symbols"
