[workspace]
members = ["crates/bone-provider"]
exclude = ["third_party/rig-core-0.42.0"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytes = "1"
futures-util = "0.3"
fs2 = "0.4"
http = "1"
libc = "0.2"
rig-core = { version = "=0.42.0", path = "third_party/rig-core-0.42.0", default-features = false, features = ["reqwest", "rustls"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
