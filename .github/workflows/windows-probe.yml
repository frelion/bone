# Temporary native diagnosis; remove after the release cwd failure is understood.
name: Windows cwd probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Cwd probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-2025, windows-11-arm]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.13"
      - name: Compare cmd and built-in PowerShell working directories
        shell: bash
        run: python scripts/release_windows_probe.py
