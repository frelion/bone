name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example, v0.2.2)"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: bone-linux-x86_64
            executable: bone
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: bone-linux-aarch64
            executable: bone
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset: bone-macos-x86_64
            executable: bone
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: bone-macos-aarch64
            executable: bone
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: bone-windows-x86_64.exe
            executable: bone.exe
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must be a semantic version beginning with v: $RELEASE_TAG" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$RELEASE_TAG")"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release -p bone-tui --bin bone --target ${{ matrix.target }}

      - name: Prepare release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "dist/${{ matrix.asset }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "dist/${{ matrix.asset }}"
          fi
          test -s "dist/${{ matrix.asset }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify release payload
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            bone-linux-x86_64
            bone-linux-aarch64
            bone-macos-x86_64
            bone-macos-aarch64
            bone-windows-x86_64.exe
          )
          for asset in "${expected[@]}"; do
            test -s "dist/$asset"
          done
          cd dist
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create release and upload binaries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "BONE ${RELEASE_TAG#v}" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber \
            dist/bone-* \
            dist/SHA256SUMS
