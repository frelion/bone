name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  msrv:
    name: Rust 1.88 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libdbus-1-dev
      - run: cargo check --workspace --all-targets --all-features --locked

  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: sudo apt-get update && sudo apt-get install --yes pkg-config libdbus-1-dev
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: cargo doc --workspace --no-deps --all-features --locked
        env:
          RUSTDOCFLAGS: -D warnings

  rig-patch:
    name: Rig ChatGPT hardening
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: >-
          cargo test --manifest-path third_party/rig-core-0.42.0/Cargo.toml
          --no-default-features --features reqwest,rustls,test-utils
          --locked --lib providers::chatgpt
      - run: >-
          cargo test --manifest-path third_party/rig-core-0.42.0/Cargo.toml
          --no-default-features --features reqwest,rustls,test-utils
          --locked --lib atomic_json_write_replaces_complete_private_record

  macos:
    name: macOS checks
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: 'cargo test -p bone-app --lib storage:: --locked'
      - run: cargo test -p bone-tui --lib --locked

  windows:
    name: Windows checks
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: 'cargo test -p bone-app --lib storage:: --locked'
      - run: cargo test -p bone-tui --lib --locked
