<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BONE · 组件尺寸与层级</title><style>*{box-sizing:border-box}body{margin:0;background:#121212;color:#e6e6e6;font:15px system-ui}header{padding:20px 28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid #404040}button{background:#252525;color:#eee;border:1px solid #505050;padding:10px 16px;cursor:pointer}button[aria-pressed=true]{border-color:#ff9d24}p{margin:0;color:#aaa}main{overflow:auto}img{display:block;max-width:none}label{margin-left:auto}small{display:block;padding:14px 28px;color:#aaa}</style><header><strong>BONE · 组件尺寸与层级</strong><button data-src="after" aria-pressed="true">会话</button><button data-src="before">上一版</button><button data-src="commands">命令</button><button data-src="models">模型</button><button data-src="form">接入表单</button><button data-src="80">80 × 24</button><button data-src="40">40 × 12</button><label><input id="fit" type="checkbox">适应宽度</label></header><small>默认按原始尺寸显示，避免把整个终端缩成一张小图。合成会话经真实 TUI 渲染器输出；字体由预览环境呈现，实际终端字号没有被修改。</small><main><img id="preview" src="after.svg" alt="BONE TUI 预览"></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelector('#preview').src=b.dataset.src+'.svg';document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});document.querySelector('#fit').onchange=e=>{let i=document.querySelector('#preview');i.style.maxWidth=e.target.checked?'100%':'none';i.style.height='auto'}</script></html>
