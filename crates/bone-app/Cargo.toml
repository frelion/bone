[package]
name = "bone-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Headless application, assembly, and durable sessions for BONE"
publish = false

[dependencies]
bone-adapters = { path = "../bone-adapters" }
bone-core = { path = "../bone-core" }
fs2.workspace = true
keyring.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
bone-adapters = { path = "../bone-adapters", features = ["test-utils"] }
rig-core = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
