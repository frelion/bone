[package]
name = "bone-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Headless application, assembly, and durable sessions for BONE"
publish = false

[dependencies]
bone-agent = { path = "../bone-agent" }
bone-llm = { path = "../bone-llm" }
bone-tools = { path = "../bone-tools" }
fs2.workspace = true
keyring.workspace = true
rusqlite = { workspace = true, features = ["bundled"] }
rustix.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "macros", "process", "rt-multi-thread", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
