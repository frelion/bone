[package]
name = "bone-agent"
version.workspace = true
edition.workspace = true
description = "Unified agent application, event-driven kernel, and asynchronous runtime"
readme = "README.md"
publish = false

[dependencies]
bone-config = { path = "../bone-config" }
bone-llm = { path = "../bone-llm" }
bone-tools = { path = "../bone-tools" }
futures-util.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }

[dev-dependencies]
bone-llm = { path = "../bone-llm", features = ["test-utils"] }
rig-core = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
