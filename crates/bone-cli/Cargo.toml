[package]
name = "bone-cli"
version.workspace = true
edition.workspace = true
description = "Runnable BONE agent"
publish = false

[[bin]]
name = "bone"
path = "src/main.rs"

[dependencies]
bone-agent = { path = "../bone-agent" }
bone-llm = { path = "../bone-llm" }
bone-tools = { path = "../bone-tools" }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "rt-multi-thread"] }

[dev-dependencies]
bone-llm = { path = "../bone-llm", features = ["test-utils"] }
rig-core = { workspace = true, features = ["test-utils"] }
serde_json.workspace = true
tempfile.workspace = true
