[package]
name = "bone-cli"
version.workspace = true
edition.workspace = true
description = "Runnable BONE agent"
publish = false

[[bin]]
name = "bone"
path = "src/main.rs"

[dependencies]
bone-agent = { path = "../bone-agent" }
bone-config = { path = "../bone-config" }
bone-llm = { path = "../bone-llm" }
bone-tools = { path = "../bone-tools" }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
bone-llm = { path = "../bone-llm", features = ["test-utils"] }
rig-core = { workspace = true, features = ["test-utils"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
